<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="梗日报 - 每天给你好聊的，工作生活聊天话题每日更新">
  <title>梗日报 | 每天给你好聊的</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <h1 class="logo"><span class="logo-icon">🗣️</span> 梗日报</h1>
          <p class="tagline">每天给你好聊的</p>
        </div>
        <div class="header-right">
          <div class="slot-badge" id="slotBadge">加载中</div>
          <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
            <span class="theme-icon-light">☀️</span>
            <span class="theme-icon-dark">🌙</span>
          </button>
        </div>
      </div>
    </header>

    <div class="meta-bar" id="metaBar">
      <span class="meta-date" id="metaDate"></span>
      <span class="meta-sep">·</span>
      <span class="meta-count" id="metaCount"></span>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <main class="content">
      <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>正在加载今日梗...</p>
      </div>
      <div class="error-box" id="error" style="display:none">
        <p>😅 内容加载失败，请稍后刷新重试</p>
      </div>
      <div class="content-grid" id="contentGrid" style="display:none"></div>
    </main>

    <footer class="app-footer">
      <p id="footerInfo"></p>
      <p class="footer-sub">内容由 AI 生成 · 仅供聊天参考 · 请以实际信息为准</p>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
